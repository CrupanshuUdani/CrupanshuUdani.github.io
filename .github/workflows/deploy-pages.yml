name: Build and publish GitHub Pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Publish static site to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/portfolio-pages
          mkdir -p /tmp/portfolio-pages
          cp -R dist/public/. /tmp/portfolio-pages/
          touch /tmp/portfolio-pages/.nojekyll
          git fetch origin gh-pages || true
          git checkout --orphan gh-pages-publish
          git rm -rf .
          cp -R /tmp/portfolio-pages/. .
          git add .
          git commit -m "Deploy static portfolio"
          git push --force origin gh-pages-publish:gh-pages
